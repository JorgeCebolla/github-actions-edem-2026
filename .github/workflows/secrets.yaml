name: Manejo de secretos

on:
  workflow_dispatch:

jobs:
  simulated_login:
    name: Login simulado
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar el secreto y simular login
        env:
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          if [ -z "$PASSWORD" ]; then
            echo "Falta configurar el secreto PASSWORD en GitHub."
            exit 1
          fi

          echo "Secreto recibido: *** (valor oculto)"
          echo "Login simulado correcto para el usuario de prueba."
